# Only the gateway may call the app (Envoy here; deploy/haproxy changes the namespace), and the app may only reach DNS and Postgres. Needs a CNI that enforces
# NetworkPolicy; without one this is silently ignored. Kubelet probes come from the node and are allowed.
#
# With TELEMETRY_ENABLED=true, add an egress rule for the OTLP collector. A real payment, CRM or market
# data client needs one too: the current integrations are in-process sandboxes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: moneystack
  namespace: moneystack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: moneystack
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: http
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Any address on the Postgres port. Narrow it with an ipBlock if the database has a fixed range.
    - ports:
        - port: 5432
          protocol: TCP
