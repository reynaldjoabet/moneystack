# money.example.com -> Service moneystack, on the shared Gateway (TLS ends there).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moneystack
  namespace: moneystack
spec:
  parentRefs:
    - name: public
      namespace: infra
      sectionName: https # HTTPS only; the platform's to-https route owns :80
  hostnames:
    - money.example.com
  rules:
    # Keep the health endpoints off the internet: probes reach the Pod directly. Rewritten to a path the
    # app doesn't serve, so it answers 404 (Gateway API has no "deny" action).
    - matches:
        - path:
            type: PathPrefix
            value: /health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /not-found
      backendRefs:
        - name: moneystack
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Just over the app's own 30s limit, so the app's 503 answers first; Envoy's applies if a Pod hangs.
      timeouts:
        request: 35s
      backendRefs:
        - name: moneystack
          port: 80
---
# The password endpoints, in their own route so ratelimit.yaml can target just them. An Exact match wins
# over the "/" above. Each request costs a bcrypt check, which is also what makes them worth limiting.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moneystack-auth
  namespace: moneystack
spec:
  parentRefs:
    - name: public
      namespace: infra
      sectionName: https
  hostnames:
    - money.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /auth/login
        - path:
            type: Exact
            value: /auth/signup
        - path:
            type: Exact
            value: /auth/password
        - path:
            type: Exact
            value: /auth/password/forgot
        - path:
            type: Exact
            value: /auth/password/reset
      backendRefs:
        - name: moneystack
          port: 80
