# Helm values for HAProxy Unified Gateway: the platform's part, installed once per cluster.
# See gateway.yaml for the install command.
controller:
  replicaCount: 3
  # The chart's memory limit (2560Mi) is needed: at 768Mi HAProxy exits on startup, because its default
  # maxconn doesn't fit, while the Pod keeps running. The chart sets no probes, so without this one a Pod
  # whose HAProxy has died still reports Ready and keeps getting traffic.
  readinessProbe:
    tcpSocket:
      port: 443 # the Gateway's HTTPS listener
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: haproxy-unified-gateway
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  service:
    type: LoadBalancer
    # Keeps the client's address on traffic that reaches a node directly, and skips the second hop.
    externalTrafficPolicy: Local
  # Client addresses. The rate limit counts per address, so if the load balancer connects with its own
  # address (most HTTP or proxying LBs), every user shares one limit. Then turn on the PROXY protocol on the
  # LB and uncomment this. Every connection must then carry the header: others are rejected.
  # extraArgs:
  #   - --accept-proxy
