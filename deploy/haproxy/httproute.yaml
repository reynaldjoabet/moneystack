# money.example.com -> Service moneystack, on Gateway infra/haproxy (TLS ends there).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moneystack
  namespace: moneystack
spec:
  parentRefs:
    - name: haproxy
      namespace: infra
      sectionName: https # HTTPS only; the platform's to-https route owns the HTTP listener
  hostnames:
    - money.example.com
  rules:
    # Keep the health endpoints off the internet: probes reach the Pod directly. Rewritten to a path the
    # app doesn't serve, so it answers 404 (Gateway API has no "deny" action).
    - matches:
        - path:
            type: PathPrefix
            value: /health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /not-found
      backendRefs:
        - name: moneystack
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: moneystack
          port: 80
---
# The password endpoints, in their own route so they alone get the rate limit in ratelimit.yaml. An Exact
# match wins over the "/" above. Each request costs a bcrypt check.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moneystack-auth
  namespace: moneystack
spec:
  parentRefs:
    - name: haproxy
      namespace: infra
      sectionName: https
  hostnames:
    - money.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /auth/login
        - path:
            type: Exact
            value: /auth/signup
        - path:
            type: Exact
            value: /auth/password
      backendRefs:
        - name: moneystack
          port: 80
          filters:
            - type: ExtensionRef
              extensionRef:
                group: gate.v3.haproxy.org
                kind: Backend
                name: moneystack-auth-ratelimit
