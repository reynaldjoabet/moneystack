# How Envoy calls the moneystack Pods, for the main route. (The password routes have ratelimit.yaml; a route takes
# one BackendTrafficPolicy.)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: moneystack
  namespace: moneystack
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: moneystack
  # Retry only failures where the request never reached the app: a POST that did reach it may already have moved
  # money, so 5xx answers and timeouts are never retried.
  retry:
    numRetries: 2
    retryOn:
      triggers: [connect-failure, refused-stream, reset-before-request]
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
  # A Pod whose connections keep failing is taken out of rotation for a while, without waiting for its readiness
  # probe. App 500s don't count: a bug fails on every Pod, and ejecting them all would only add an outage.
  healthCheck:
    passive:
      splitExternalLocalOriginErrors: true
      consecutiveLocalOriginFailures: 5
      consecutiveGatewayErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  # Bounded queues: past these, Envoy answers 503 at once instead of piling up work the Pods can't take.
  circuitBreaker:
    maxConnections: 1024
    maxPendingRequests: 256
    maxParallelRequests: 1024
  # Transaction lists and CSV exports are large and compress well. Each entry needs its own block (`brotli: {}`),
  # even when empty: Envoy Gateway drops an entry without one, while still reporting the policy as Accepted.
  compressor:
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
