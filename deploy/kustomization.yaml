# moneystack behind the shared Envoy Gateway. deploy/haproxy is the same app on HAProxy instead: use one.
#
#   kubectl create namespace moneystack
#   kubectl create secret generic moneystack -n moneystack \
#     --from-literal=db-password=... --from-literal=jwt-secret="$(openssl rand -base64 48)"
#   kubectl apply -k deploy
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
  - httproute.yaml
  - ratelimit.yaml
