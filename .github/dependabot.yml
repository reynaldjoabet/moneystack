# Weekly PRs for Scala dependencies (sbt, including project/Dependencies.scala), the GitHub Actions and the
# compose images.
version: 2
updates:
  - package-ecosystem: sbt
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One grouped PR at a time, so a broken update doesn't pile up behind others.
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)
    # Scala stays on the LTS line (CLAUDE.md), so its version is bumped by hand.
    ignore:
      - dependency-name: "org.scala-lang:scala3*"
    groups:
      sbt-all:
        applies-to: version-updates
        patterns: ["*"]
      sbt-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
