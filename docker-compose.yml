# Local stack: Postgres plus the app image built by `sbt --client Docker/publishLocal`.
#   docker compose up
# The secrets below are for local use only; set real ones through your deployment's secret store.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: moneystack
      POSTGRES_PASSWORD: moneystack
      POSTGRES_DB: moneystack
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneystack -d moneystack"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    image: moneystack:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: moneystack
      DB_PASSWORD: moneystack
      DB_NAME: moneystack
      AUTH_JWT_SECRET: local-development-secret-change-me-0123456789
      LOG_FORMAT: text
    ports:
      - "8080:8080"

volumes:
  pgdata:
