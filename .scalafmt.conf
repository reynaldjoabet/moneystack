version = "3.11.5"
runner.dialect = scala3

# Match the code's existing style: wide lines with aligned arrows and `=`,
# line breaks left where the author put them, braces kept.
maxColumn = 140
align.preset = more
newlines.source = keep
docstrings.style = keep
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = false
